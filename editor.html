<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Note Editor</title>

    <link rel="stylesheet" href="./output.css" />
  </head>

  <body class="min-h-screen bg-base-200 p-6">
    <main class="mx-auto flex max-w-2xl flex-col gap-4">
      <input
        id="note-title"
        class="input input-bordered text-xl font-bold"
        type="text"
        placeholder="Note title"
      />

      <textarea
        id="note-body"
        class="textarea textarea-bordered min-h-80 text-base"
        placeholder="Start writing..."
      ></textarea>

      <div class="flex justify-between">
        <a href="index.html" class="btn btn-ghost">
          Cancel
        </a>

        <button id="save-button" class="btn btn-primary">
          Save
        </button>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
      const supabaseUrl = "https://vvjymhrzfubvpjlgvszl.supabase.co";
const supabaseAnonKey = "sb_publishable_1Nd4uQMionoaiQGj1i4BfQ_B6i9kWIu";

const supabaseClient = supabase.createClient(
  supabaseUrl,
  supabaseAnonKey
);
      const titleInput = document.getElementById("note-title");
      const bodyInput = document.getElementById("note-body");
      const saveButton = document.getElementById("save-button");

      // Read the note ID from the URL, if one exists.
      const parameters = new URLSearchParams(window.location.search);
      const noteId = parameters.get("id");

      saveButton.addEventListener("click", async function () {
  const title = titleInput.value.trim();
  const content = bodyInput.value.trim();

  if (title === "" && content === "") {
    alert("Write something before saving.");
    return;
  }

  const {
    data: { user },
    error: userError
  } = await supabaseClient.auth.getUser();

  if (userError || !user) {
    alert("You must sign in before saving a note.");
    window.location.href = "index.html";
    return;
  }

  let error;

  if (noteId) {
    const result = await supabaseClient
      .from("notes")
      .update({
        title: title || "Untitled Note",
        content: content,
        updated_at: new Date().toISOString()
      })
      .eq("id", noteId)
      .eq("user_id", user.id);

    error = result.error;
  } else {
    const result = await supabaseClient
      .from("notes")
      .insert({
        user_id: user.id,
        title: title || "Untitled Note",
        content: content
      });

    error = result.error;
  }

  if (error) {
    console.error("Could not save note:", error);
    alert(error.message);
    return;
  }

  window.location.href = "index.html";
});
  
    </script>
  </body>
</html>
