<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Lime Notes</title>

    <link rel="stylesheet" href="./output.css" />
  </head>

  <body class="min-h-screen bg-base-200 p-6">
    <main class="mx-auto flex max-w-2xl flex-col gap-6">
   <div id="auth">
  <div id="auth-menu" class="flex items-center justify-between">
    <button class="btn btn-primary" id="showSignInBtn">
      Sign In
    </button>

    <button class="btn btn-primary" id="showSignUpBtn">
      Sign Up
    </button>
        
        <a href="editor.html" class="btn btn-primary">
          New Note
        </a>
  </div>

  <div id="auth-form" class="hidden">
    <input
      type="email"
      id="email"
      placeholder="Email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <button class="btn btn-primary" id="confirmAuthBtn">
      Continue
    </button>

    <button class="btn btn-ghost" id="cancelAuthBtn">
      Cancel
    </button>
  </div>
</div>
      
      <div id="notes-list" class="flex flex-col gap-3"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
      const supabaseUrl = "https://vvjymhrzfubvpjlgvszl.supabase.co";
const supabaseAnonKey = "sb_publishable_1Nd4uQMionoaiQGj1i4BfQ_B6i9kWIu";

const supabaseClient = supabase.createClient(
  supabaseUrl,
  supabaseAnonKey
);
console.log("Supabase client:", supabaseClient);
async function testSupabaseConnection() {
  const { data, error } = await supabaseClient
    .from("notes")
    .select("*");

  if (error) {
    console.error("Supabase connection error:", error);
    return;
  }

  console.log("Supabase connection worked:", data);
}

testSupabaseConnection();
async function signUpUser(email, password) {
  const { data, error } = await supabaseClient.auth.signUp({
    email: "dontbedumb81@gmail.com",
    password: "BeWise"
  });

  if (error) {
    console.error("Sign-up error:", error);
    return;
  }

  console.log("Sign-up worked:", data);
}
      const notesList = document.getElementById("notes-list");

async function loadNotes() {
  notesList.innerHTML = "";

  const {
    data: { user },
    error: userError
  } = await supabaseClient.auth.getUser();

  if (userError) {
    console.error("Could not check user:", userError);
    return;
  }

  if (!user) {
    notesList.innerHTML = `
      <div class="rounded-box bg-base-100 p-8 text-center shadow">
        <p class="text-base-content/60">
          Sign in to see your notes.
        </p>
      </div>
    `;
    return;
  }

  const { data: notes, error } = await supabaseClient
    .from("notes")
    .select("*")
    .eq("user_id", user.id)
    .order("updated_at", { ascending: false });

  if (error) {
    console.error("Could not load notes:", error);
    alert(error.message);
    return;
  }

  if (notes.length === 0) {
    notesList.innerHTML = `
      <div class="rounded-box bg-base-100 p-8 text-center shadow">
        <p class="text-base-content/60">
          You don't have any notes yet.
        </p>
      </div>
    `;
    return;
  }

  notes.forEach(function (note) {
    const noteLink = document.createElement("a");

    noteLink.href = `editor.html?id=${note.id}`;
    noteLink.className =
      "card bg-base-100 shadow transition hover:shadow-md";

    noteLink.innerHTML = `
      <div class="card-body">
        <h2 class="card-title">${escapeHtml(note.title || "")}</h2>
        <p class="text-base-content/60">
          ${escapeHtml((note.content || "").slice(0, 100))}
        </p>
      </div>
    `;

    notesList.appendChild(noteLink);
  });
}

function escapeHtml(text) {
  const element = document.createElement("div");
  element.textContent = text;
  return element.innerHTML;
}

const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");

const authMenu = document.getElementById("auth-menu");
const authForm = document.getElementById("auth-form");
console.log(authForm);

const showSignUpButton = document.getElementById("showSignUpBtn");
const showSignInButton = document.getElementById("showSignInBtn");

const confirmAuthButton = document.getElementById("confirmAuthBtn");
const cancelAuthButton = document.getElementById("cancelAuthBtn");

let authMode = null;

showSignInButton.addEventListener("click", function () {
  authMode = "sign-in";

  authMenu.classList.add("hidden");
  authForm.classList.remove("hidden");

  confirmAuthButton.textContent = "Sign In";
});

showSignUpButton.addEventListener("click", function () {
  authMode = "sign-up";

  authMenu.classList.add("hidden");
  authForm.classList.remove("hidden");

  confirmAuthButton.textContent = "Create Account";
});

cancelAuthButton.addEventListener("click", function () {
  authMode = null;

  authForm.classList.add("hidden");
  authMenu.classList.remove("hidden");

  emailInput.value = "";
  passwordInput.value = "";
});

confirmAuthButton.addEventListener("click", async function () {
  if (authMode === "sign-up") {
    const { data, error } = await supabaseClient.auth.signUp({
      email: emailInput.value,
      password: passwordInput.value
    });

    if (error) {
      console.error("Sign-up error:", error);
      alert(error.message);
      return;
    }

    console.log("Sign-up successful:", data);
    alert("Sign-up successful. Check your email if confirmation is enabled.");
  }

  if (authMode === "sign-in") {
    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email: emailInput.value,
      password: passwordInput.value
    });

    if (error) {
      console.error("Sign-in error:", error);
      alert(error.message);
      return;
    }

    console.log("Sign-in successful:", data);
    alert("Sign-in successful.");
  }

  authForm.classList.add("hidden");
  authMenu.classList.remove("hidden");

  emailInput.value = "";
  passwordInput.value = "";

  loadNotes();
});

loadNotes();
    </script>
  </body>
</html>
